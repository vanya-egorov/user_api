version: "3.9"

services:
  user_api:
    build:
      context: ./
      dockerfile: Dockerfile
    volumes:
      - ./:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    command: go run cmd/main.go
    restart: unless-stopped

  migrate:
    image: migrate/migrate
    entrypoint: ["/bin/sh", "-c", "migrate -path /migrations -database postgres://postgres:postgres@postgres:5432/userdb?sslmode=disable up"]
    volumes:
      - ./migrations:/migrations
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"


volumes:
  pg_data:
    driver: local